# -----------------------------------------------------------------------------
# NatAmbio -- asymmetric XTC generator, asymmetric speaker placement.
#
# The case the asymmetric model was originally written for: the two speakers sit
# at different angles and distances from the listening position, so each one has
# its own ITD and its own azimuth.
#
#     natambio-xtc-filters-asym -c xtc_asym_geometry.toml
#
# Produces three filters: one direct (shared by both channels, since the two
# direct filters of the model are identical) and one cross filter per channel.
#
# Note which side feeds which speaker: the cross filter that feeds the LEFT
# speaker is built from the RIGHT side's parameters, because it cancels the
# right speaker's leakage into the left ear and the only direct path reaching
# that ear is the left speaker's. The tool handles this; it matters when reading
# the output, since <prefix>_cross_left.wav carries the right side's ITD.
# -----------------------------------------------------------------------------

sample_rate = 48000

# The ladder now extends over N*(itd_left + itd_right), so what has to fit is
# the SUM of both ITDs, not the larger of the two.
filter_len = 4096

# --- Fractional ITD ----------------------------------------------------------
# Optional, off by default. The recursion places its taps at whole samples, so
# each itd_us is rounded first: at 48 kHz 180 us is 8.64 samples and becomes 9,
# 140 us is 6.72 and becomes 7. The two sides are rounded independently and the
# round-trip period (itd_left + itd_right) inherits both errors, so a geometry
# can carry up to a full sample of period error -- more than the symmetric case
# can. That error leaves a residual 2*sin(pi*f*dt) relative to the cancelling
# signal, which caps crosstalk suppression in the top octaves.
#
# frac_delay = true runs the same recursion in the frequency domain, where a tap
# is a linear-phase factor and neither ITD needs rounding. model_delay is the
# bulk delay that path adds to all three filters so the two-sided response of a
# fractional shift is not clipped at n = 0; being common to all three it costs
# latency and nothing else. Omit it and it comes from sample_rate -- 1.33 ms,
# which is 64 taps at 48 kHz, 59 at 44.1 and 128 at 96 -- the same figure
# natambio uses, so a filter generated here carries the latency the processor
# would have added. Set it only to override that.
#
# With no output.prefix the default one becomes XTC_asym_frac, so the two
# designs cannot overwrite each other; an explicit prefix, as below, is used as
# written and it is on you to keep them apart. See
# tools/python_xtc_filters/compare_frac_delay.py, which measures both against
# the modelled plant.
# frac_delay  = true
# model_delay = 64   # omit: derived from sample_rate
[left]
itd_us = 180
ild_db = 10.0
ild_alpha = 1.8
azimuth_deg = 20

[right]
itd_us = 160
ild_db = 9.0
ild_alpha = 1.8
azimuth_deg = 17

[output]
directory = "filters"
prefix = "XTC_asym_geometry"

# Remember the balance. These coefficients are M^-1: the level trim between
# channels is NOT in them. Apply it downstream as a gain on the two convolutions
# feeding the same output, attenuating the channel that arrives louder and never
# amplifying the other. Left unadjusted, it caps cancellation at 20*log10|1-b|:
# a 1 dB error puts the ceiling near -19 dB, a 3 dB error near -11 dB.
