# -----------------------------------------------------------------------------
# NatAmbio -- symmetric XTC generator, default configuration.
#
# Reproduces the built-in defaults of natambio-xtc-filters, i.e. exactly what
# the tool produces when invoked with no parameters at all. Good starting point
# for a conventional stereo layout: two speakers at the same angle, listener on
# the axis of symmetry.
#
#     natambio-xtc-filters -c xtc_sym_default.toml
#
# Read by the C tool and, unchanged, by tools/python_xtc_filters/xtc_filters.py.
# -----------------------------------------------------------------------------

sample_rate = 48000

# Filter length in taps. Must comfortably exceed 16 * itd_us converted to
# samples, or the top of the recursion ladder is truncated and cancellation
# comes out incomplete; the tool warns when that happens.
filter_len = 4096

# --- Fractional ITD ----------------------------------------------------------
# Optional, off by default. The recursion places its taps at whole samples, so
# the ITD is rounded first: at 48 kHz an itd_us of 170 is 8.16 samples and gets
# rounded to 8. That 0.16-sample error is not free -- it leaves a residual
# 2*sin(pi*f*dt) relative to the cancelling signal, which caps crosstalk
# suppression at about -27 dB above 8 kHz where the exact ITD reaches the
# ladder's own floor some 55 dB lower.
#
# frac_delay = true runs the same recursion in the frequency domain, where a tap
# is a linear-phase factor and the ITD needs no rounding. model_delay is the bulk
# delay that path adds to every filter so the two-sided response of a fractional
# shift is not clipped at n = 0; it is common to all of them and therefore costs
# latency and nothing else. Omit it and it comes from sample_rate -- 1.33 ms,
# which is 64 taps at 48 kHz, 59 at 44.1 and 128 at 96 -- the same figure
# natambio uses, so a filter generated here carries the latency the processor
# would have added. Set it only to override that.
#
# The output filenames gain a _frac suffix so the two designs cannot overwrite
# each other. See tools/python_xtc_filters/compare_frac_delay.py, which measures
# both against the modelled plant.
# frac_delay  = true
# model_delay = 64   # omit: derived from sample_rate

[xtc]
# Inter-aural time difference, microseconds. Sets the spacing of the ladder.
itd_us = 170

# Inter-aural level difference per step, positive dB. Lower values mean a more
# aggressive cancellation: wider image, but over-cancelling collapses it.
ild_db = 14.0

# Scale factor of the empirical ILD spectrum model. Trades spatial effect
# against tonal coloration; tune by ear.
ild_alpha = 2.0

# Half-angle between the two speakers as seen from the listening position.
azimuth_deg = 20

[output]
directory = "filters"

# With no prefix the historical descriptive filenames are used:
#   XTC_20_deg_ITD_170_micsec_ILD_14.0_dB_a_2.0_{direct,cross}.wav
# Set one to get <prefix>_{direct,cross}.wav instead.
# prefix = "living_room"
