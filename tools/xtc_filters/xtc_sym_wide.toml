# -----------------------------------------------------------------------------
# NatAmbio -- symmetric XTC generator, wide-image configuration.
#
# More aggressive than the default: a lower ild_db makes the cancellation
# stronger and the virtual scene wider. This is the direction to explore when
# the image feels narrow, and the direction to back off from at the first sign
# of the image collapsing or of tonal coloration.
#
#     natambio-xtc-filters -c xtc_sym_wide.toml
#
# The failure is not symmetric: falling short only narrows the scene, whereas
# over-cancelling destroys it, because the corrective signal exceeds the actual
# crosstalk. Approach the setting from above -- start at the default 14 dB and
# come down -- rather than from below.
# -----------------------------------------------------------------------------

sample_rate = 48000

# 8192 rather than 4096: the ladder is the same length in time, but the extra
# headroom keeps the top rungs from being truncated at a longer ITD.
filter_len = 8192

# --- Fractional ITD ----------------------------------------------------------
# Optional, off by default. The recursion places its taps at whole samples, so
# the ITD is rounded first: at 48 kHz an itd_us of 170 is 8.16 samples and gets
# rounded to 8. That 0.16-sample error is not free -- it leaves a residual
# 2*sin(pi*f*dt) relative to the cancelling signal, which caps crosstalk
# suppression at about -27 dB above 8 kHz where the exact ITD reaches the
# ladder's own floor some 55 dB lower.
#
# frac_delay = true runs the same recursion in the frequency domain, where a tap
# is a linear-phase factor and the ITD needs no rounding. model_delay is the bulk
# delay that path adds to every filter so the two-sided response of a fractional
# shift is not clipped at n = 0; it is common to all of them and therefore costs
# latency and nothing else. 64 taps is 1.3 ms at 48 kHz and leaves ~20 dB of
# margin.
#
# The output filenames gain a _frac suffix so the two designs cannot overwrite
# each other. See tools/python_xtc_filters/compare_frac_delay.py, which measures
# both against the modelled plant.
# frac_delay  = true
# model_delay = 64

[xtc]
itd_us = 190

# 12 dB instead of 14: about 2 dB more cancellation per step.
ild_db = 12.0

ild_alpha = 2.2
azimuth_deg = 25

[output]
directory = "filters"
prefix = "XTC_wide"
