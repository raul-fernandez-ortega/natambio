<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="Helvetica, Arial, sans-serif">
<title>Perceptual circle of rank-1 stereo pairs</title>
<desc>A circle representing every possible direction of a rank-1 stereo pair in the Mid/Side plane. The upper semicircle corresponds to correlated signals and the lower one to anti-correlated signals. At the top, pure Mid with zero ILD, maximum localization. At the bottom, pure Side with zero ILD, maximum delocalization. Left and right, extreme panning with infinite ILD. Between extreme panning and pure Side lies the maximum of perceived laterality, at an ILD still to be determined.</desc>

<rect width="900" height="640" fill="#fbfbf9"/>

<text x="450" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2430">
  The space of a rank-1 stereo pair</text>
<text x="450" y="60" text-anchor="middle" font-size="13.5" fill="#5c6474">
  All combinations of [1,1] and [1,−1] · circle angle = 2φ, with tan φ = (1−ρ)/(1+ρ)</text>

<!-- semicircles -->
<path d="M 215 290 A 145 145 0 0 1 505 290 Z" fill="#4a7fb5" fill-opacity="0.10"/>
<path d="M 215 290 A 145 145 0 0 0 505 290 Z" fill="#c96442" fill-opacity="0.10"/>

<circle cx="360" cy="290" r="145" fill="none" stroke="#8a92a3" stroke-width="1.6"/>
<line x1="215" y1="290" x2="505" y2="290" stroke="#8a92a3" stroke-width="1.2" stroke-dasharray="6 4"/>

<text x="360" y="248" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3d6fa3">corr = +1</text>
<text x="360" y="345" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b4552f">corr = −1</text>

<!-- travel arrow -->
<path d="M 300 168 A 145 145 0 0 0 224 246" fill="none" stroke="#8a92a3" stroke-width="1.2"/>
<path d="M 227 238 L 223 250 L 234 247 Z" fill="#8a92a3"/>
<text x="243" y="196" font-size="11" fill="#8a92a3">increasing φ</text>

<!-- ============ POINTS INHERENT TO THE MODEL ============ -->

<!-- TOP: pure M -->
<circle cx="360" cy="145" r="7.5" fill="#1f2430"/>
<line x1="360" y1="137" x2="360" y2="108" stroke="#1f2430" stroke-width="1"/>
<text x="360" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2430">MAXIMUM LOCALIZATION</text>
<text x="360" y="115" text-anchor="middle" font-size="12" fill="#5c6474">centered and compact</text>
<text x="360" y="167" text-anchor="middle" font-size="11.5" fill="#1f2430">φ = 0°  ·  [1, 1]</text>
<text x="360" y="182" text-anchor="middle" font-size="11.5" fill="#5c6474">ILD 0 dB</text>

<!-- BOTTOM: pure S -->
<circle cx="360" cy="435" r="7.5" fill="#1f2430"/>
<line x1="360" y1="443" x2="360" y2="472" stroke="#1f2430" stroke-width="1"/>
<text x="360" y="488" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2430">MAXIMUM DELOCALIZATION</text>
<text x="360" y="505" text-anchor="middle" font-size="12" fill="#5c6474">raised center — the "aura"</text>
<text x="360" y="521" text-anchor="middle" font-size="11.5" fill="#8a92a3">= loudspeaker with inverted polarity</text>
<text x="360" y="418" text-anchor="middle" font-size="11.5" fill="#1f2430">φ = 90°  ·  [1, −1]</text>
<text x="360" y="403" text-anchor="middle" font-size="11.5" fill="#5c6474">ILD 0 dB</text>

<!-- ============ POINTS STILL TO BE BOUNDED ============ -->

<!-- LEFT: extreme panning -->
<circle cx="215" cy="290" r="7.5" fill="#fbfbf9" stroke="#c96442" stroke-width="2.5"/>
<line x1="207" y1="290" x2="176" y2="290" stroke="#c96442" stroke-width="1" stroke-dasharray="3 3"/>
<text x="170" y="274" text-anchor="end" font-size="12.5" font-weight="600" fill="#b4552f">least open point</text>
<text x="170" y="291" text-anchor="end" font-size="12" fill="#5c6474">the XTC sets its position,</text>
<text x="170" y="306" text-anchor="end" font-size="12" fill="#5c6474">not the loudspeakers</text>
<text x="170" y="323" text-anchor="end" font-size="11.5" font-style="italic" fill="#b4552f">not quantified in degrees</text>
<text x="228" y="272" font-size="11.5" fill="#1f2430">φ = 45°</text>
<text x="228" y="287" font-size="11.5" fill="#5c6474">ILD ∞</text>

<!-- RIGHT: extreme panning -->
<circle cx="505" cy="290" r="7.5" fill="#fbfbf9" stroke="#c96442" stroke-width="2.5"/>
<line x1="513" y1="290" x2="544" y2="290" stroke="#c96442" stroke-width="1" stroke-dasharray="3 3"/>
<text x="550" y="288" font-size="11.5" fill="#1f2430">φ = 135°  ·  ILD ∞</text>
<text x="550" y="304" font-size="12" fill="#5c6474">(mirror)</text>

<!-- BOTTOM-LEFT: maximum laterality -->
<circle cx="250" cy="385" r="7.5" fill="#fbfbf9" stroke="#c96442" stroke-width="2.5"/>
<line x1="244" y1="391" x2="216" y2="418" stroke="#c96442" stroke-width="1" stroke-dasharray="3 3"/>
<text x="210" y="424" text-anchor="end" font-size="13.5" font-weight="700" fill="#b4552f">MAXIMUM LATERALITY</text>
<text x="210" y="441" text-anchor="end" font-size="12" fill="#5c6474">opens beyond the loudspeakers</text>
<text x="210" y="459" text-anchor="end" font-size="11.5" fill="#1f2430">ILD ≈ 7.7 – 9.5 dB · φ ≈ 63–67°</text>
<text x="210" y="475" text-anchor="end" font-size="11.5" font-style="italic" fill="#b4552f">measured · invariant to the XTC ILD</text>

<!-- BOTTOM-RIGHT: mirror -->
<circle cx="470" cy="385" r="7.5" fill="#fbfbf9" stroke="#c96442" stroke-width="2.5"/>
<line x1="476" y1="391" x2="504" y2="418" stroke="#c96442" stroke-width="1" stroke-dasharray="3 3"/>
<text x="510" y="424" font-size="11.5" fill="#5c6474">mirror · φ ≈ 113–117°</text>

<!-- ============ LEGEND ============ -->
<line x1="600" y1="120" x2="600" y2="530" stroke="#e2e0da" stroke-width="1"/>

<text x="630" y="140" font-size="13.5" font-weight="700" fill="#1f2430">How to read it</text>

<circle cx="640" cy="172" r="6.5" fill="#1f2430"/>
<text x="658" y="169" font-size="12" font-weight="600" fill="#1f2430">Inherent to the model</text>
<text x="658" y="185" font-size="11.5" fill="#5c6474">The two ends of the focus</text>
<text x="658" y="200" font-size="11.5" fill="#5c6474">axis. They do not depend</text>
<text x="658" y="215" font-size="11.5" fill="#5c6474">on the configuration.</text>

<circle cx="640" cy="248" r="6.5" fill="#fbfbf9" stroke="#c96442" stroke-width="2.5"/>
<text x="658" y="245" font-size="12" font-weight="600" fill="#b4552f">Measured, not derived</text>
<text x="658" y="261" font-size="11.5" fill="#5c6474">The laterality maximum does</text>
<text x="658" y="276" font-size="11.5" fill="#5c6474">not move when the filter ILD</text>
<text x="658" y="291" font-size="11.5" fill="#5c6474">is changed between 8 and 20 dB.</text>

<text x="630" y="330" font-size="12.5" font-weight="600" fill="#1f2430">The structure</text>
<text x="630" y="352" font-size="11.5" fill="#5c6474">· The upper semicircle is</text>
<text x="630" y="367" font-size="11.5" fill="#5c6474">  correlated content; the</text>
<text x="630" y="382" font-size="11.5" fill="#5c6474">  lower one, anti-correlated.</text>
<text x="630" y="404" font-size="11.5" fill="#5c6474">· The horizontal diameter is</text>
<text x="630" y="419" font-size="11.5" fill="#5c6474">  extreme panning: crossing</text>
<text x="630" y="434" font-size="11.5" fill="#5c6474">  it flips the sign.</text>
<text x="630" y="456" font-size="11.5" fill="#5c6474">· Top and bottom are both</text>
<text x="630" y="471" font-size="11.5" fill="#5c6474">  "centered", but in two</text>
<text x="630" y="486" font-size="11.5" fill="#5c6474">  opposite ways.</text>
<text x="630" y="508" font-size="11.5" fill="#5c6474">· Laterality is not</text>
<text x="630" y="523" font-size="11.5" fill="#5c6474">  monotonic: it is a hump.</text>

<text x="450" y="572" text-anchor="middle" font-size="11.5" fill="#8a92a3">
  A rank-1 pair has only one degree of freedom: its direction. Adding the orthogonal component</text>
<text x="450" y="588" text-anchor="middle" font-size="11.5" fill="#8a92a3">
  takes the point off the circle — that is the second dimension, the eccentricity.</text>
</svg>
